spring:
application:
name: spring-gift
datasource:
url: jdbc:h2:file:./data/testdb;AUTO_SERVER=TRUE
username: sa
password: ""
driver-class-name: org.h2.Driver
h2:
console:
enabled: true
path: /h2-console
sql:
init:
mode: always
encoding: UTF-8
schema-locations: classpath:schema.sql
data-locations: classpath:data.sql
jpa:
hibernate:
ddl-auto: none

logging:
level:
org.springframework.security: DEBUG

spring:
profiles:
active: local
